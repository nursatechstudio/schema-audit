name: schema-audit

on:
  push:
    paths:
      - "audit.mjs"
      - "targets.txt"
      - "targets.json"
      - ".github/**"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Schema Audit
        run: node audit.mjs

      - name: Commit updated reports
        run: |
          if [ -n "$(git status --porcelain audit.md audit.json)" ]; then
            git config user.name "lead-kit[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audit.md audit.json
            git commit -m "audit update $(date -u +%F)"
            git push
          else
            echo "audit.md and audit.json are unchanged; nothing to commit."
          fi
